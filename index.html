<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elena Outside · honest travel guides &amp; prints</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://corraoelena.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&amp;family=Jost:wght@300;400&amp;family=Sacramento&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#e8f4f2;color:#1f2a33;font-family:'Jost',sans-serif;font-weight:300;font-size:17px;line-height:1.7;
  display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px;background:#ffffff;padding:52px 36px 44px;text-align:center;
  box-shadow:0 18px 44px rgba(31,42,51,0.10);display:flex;flex-direction:column;align-items:center;gap:18px}
.logo{font-family:'Sacramento',cursive;font-size:58px;line-height:0.9}
.label{font-size:11px;letter-spacing:0.24em;text-transform:uppercase}
h1{margin:6px 0 0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:34px;line-height:1.1;letter-spacing:-0.01em}
form{width:100%;display:flex;flex-wrap:wrap;margin-top:10px}
form label{flex-basis:100%;text-align:left;margin-bottom:10px}
input{flex:1 1 200px;min-width:0;font:inherit;font-size:16px;padding:15px 18px;border:1px solid #1f2a33;border-right:none;
  background:#ffffff;color:#1f2a33;border-radius:0}
button{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:0.24em;text-transform:uppercase;padding:17px 26px;
  border:1px solid #1f2a33;background:#1f2a33;color:#ffffff;cursor:pointer;border-radius:0}
button:hover{background:#0b5257;border-color:#0b5257}
.msg{min-height:1.7em;margin:0;font-size:14px;color:#b23a2e;visibility:hidden}
.err .msg{visibility:visible}
@media (max-width:420px){
  .card{padding:44px 24px 36px}
  input{border-right:1px solid #1f2a33;flex-basis:100%}
  button{width:100%;margin-top:10px}
}
</style>
</head>
<body>
<main class="card">
  <span class="logo">elena outside</span>
  <span class="label">honest travel guides &amp; prints</span>
  <h1>Coming soon.</h1>
  <form id="key" autocomplete="off">
    <label for="pw" class="label">Password</label>
    <input id="pw" type="password" autocomplete="off">
    <button type="submit">Enter</button>
  </form>
  <p class="msg" id="msg" aria-live="polite">That's not it. Try again.</p>
</main>
<script>
// Soft gate: keeps the casual public out, not bank-grade. Only the SHA-256 hash of the password lives here.
const EXPECTED = "05b3abf2579a5eb66403cd78be557fd860633a1fe2103c7642030defe32c657f";
const DEST = "site/index.html";

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

const card = document.querySelector(".card");
const pw = document.getElementById("pw");
document.getElementById("key").addEventListener("submit", async (e) => {
  e.preventDefault();
  if(await sha256(pw.value.trim().toLowerCase()) === EXPECTED){
    sessionStorage.setItem("eleanora_pass", "1");
    location.href = DEST + "?v=" + Date.now();
  } else {
    card.classList.add("err");
    pw.value = "";
    pw.focus();
  }
});
pw.addEventListener("input", () => card.classList.remove("err"));
</script>
</body>
</html>
