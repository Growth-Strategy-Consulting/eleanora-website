<script>
// Soft gate. Password is stored only as a SHA-256 hash (same word as the main
// site: "yellowbird"). Input is normalised (trim, lowercase, spaces removed) so
// "yellowbird" and "yellow bird" both work.
(function () {
  var EXPECTED = "1f76b0e5058f716c3026eeb07599915e84f2c6de83fee6d1754d55f008689cc0";
  async function sha256(s) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }
  var pw = document.getElementById("pw"),
      err = document.getElementById("err"),
      go = document.getElementById("go");
  async function tryit() {
    var norm = pw.value.trim().toLowerCase().replace(/\s+/g, "");
    if (!norm) return;
    var h = await sha256(norm);
    if (h === EXPECTED) {
      sessionStorage.setItem("cat_ok", "1");
      location.href = "catalog.html";
    } else {
      err.textContent = "Nice try. That's not it.";
      pw.value = "";
      pw.focus();
    }
  }
  go.addEventListener("click", tryit);
  pw.addEventListener("keydown", function (e) { if (e.key === "Enter") tryit(); });
})();
</script>
